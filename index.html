<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>古典樂・生活配樂</title>
<style>
:root{--bg:#FBFBFA;--ink:#1A1A1A;--mute:#6B6B6B;--dot:#D6D6D2;--rule:#DCDCD8;--tb:55%;--tl:86%;--tt:22%;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15161A;--ink:#EDEDEA;--mute:#A0A0A0;--dot:#2C2D33;--rule:#33343B;--tb:28%;--tl:24%;--tt:90%}}
:root[data-theme="dark"]{--bg:#15161A;--ink:#EDEDEA;--mute:#A0A0A0;--dot:#2C2D33;--rule:#33343B;--tb:28%;--tl:24%;--tt:90%}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;background:var(--bg) radial-gradient(var(--dot) 1.3px,transparent 1.4px) 0 0/24px 24px;color:var(--ink);font:17px/1.6 "Noto Serif TC","Songti TC","Source Han Serif TC","PMingLiU",serif}
main{max-width:560px;margin:0 auto;padding:28px 20px 56px}
a{color:inherit}
.tile,.back{cursor:pointer;-webkit-tap-highlight-color:transparent}
a:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
h1{font-size:clamp(28px,8vw,38px);line-height:1.25;font-weight:900;letter-spacing:.1em;margin:8px 0 6px}
.lead{margin:0 0 24px;color:var(--mute);font-size:15px}
.grid{display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:92px;gap:14px}
.tile{display:flex;flex-direction:column;justify-content:center;gap:3px;padding:0 16px;border-radius:20px;text-decoration:none;background:hsl(var(--h) var(--tb) var(--tl));color:hsl(var(--h) 45% var(--tt))}
.tile:active{transform:scale(.97)}
.tt{display:flex;align-items:baseline;justify-content:space-between;font-size:26px;font-weight:900;line-height:1.2;letter-spacing:.06em}
.tt small{font-size:12px;font-weight:400;letter-spacing:0;opacity:.75}
.ts{font-size:12px;line-height:1.4;opacity:.85}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:2;display:flex;align-items:center;justify-content:space-between;background:var(--bg);border-bottom:3px double var(--ink);margin-bottom:18px}
.back{display:inline-flex;align-items:center;gap:12px;padding:12px 8px 12px 0;font-size:16px;font-weight:700;letter-spacing:.2em;text-decoration:none}
.back i{width:9px;height:9px;border-left:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(45deg);margin-left:4px}
.back:active{opacity:.6}
.run{font-size:12px;letter-spacing:.12em;color:var(--mute)}
.hero{padding:22px 20px;border-radius:26px;margin-bottom:8px;background:hsl(var(--h) var(--tb) var(--tl));color:hsl(var(--h) 45% var(--tt))}
h2{font-size:clamp(32px,10vw,44px);font-weight:900;line-height:1.2;letter-spacing:.08em;margin:0 0 4px}
.hero p{margin:0;font-size:14px;opacity:.85}
.pieces{list-style:none;margin:0;padding:0}
.pieces li{display:flex;align-items:center;gap:14px;padding:18px 4px;border-bottom:1px solid var(--rule)}
.tx{flex:1;min-width:0}
.sit{display:block;margin-bottom:2px;font-size:12px;font-weight:700;letter-spacing:.08em;color:hsl(var(--h) 45% var(--tt))}
.zh{display:block;font-size:18px;font-weight:700;line-height:1.5}
.en{display:block;margin-top:3px;font-size:13px;color:var(--mute);font-style:italic;line-height:1.5;overflow-wrap:anywhere}
.play{flex:none;text-decoration:none;font-size:15px;font-weight:700;letter-spacing:.1em;padding:8px 20px;border-radius:99px;background:hsl(var(--h) var(--tb) var(--tl));color:hsl(var(--h) 45% var(--tt))}
.play:active{transform:scale(.95)}
@media (prefers-reduced-motion:reduce){.tile:active,.play:active{transform:none}}
</style>
</head>
<body>

const app=document.getElementById("app"),T="古典樂・生活配樂";
function home(){
  document.title=T;
  app.innerHTML=`<h1>${T}</h1><p class="lead">選一個此刻的情境，挑一首來聽。</p><div class="grid">${DATA.map((g,i)=>`<a class="tile" role="button" tabindex="0" style="--h:${g.h}" data-go="${i}"><span class="tt">${g.t}<small>${g.s.length} 首</small></span><span class="ts">${g.n}</span></a>`).join("")}</div>`;
}
function detail(i){
  const g=DATA[i];document.title=g.t+"｜"+T;
  const rows=g.s.map(x=>{const [zh,c,en,sp,sit]=x.split("|");
    const u=sp||("https://www.youtube.com/results?search_query="+encodeURIComponent(c+" "+en));
    return `<li><span class="tx">${sit?`<span class="sit">${sit}</span>`:""}<span class="zh">${zh}</span><span class="en">${c}：${en}</span></span><a class="play" href="${u}" aria-label="播放 ${zh}">播放</a></li>`}).join("");
  app.innerHTML=`<div style="--h:${g.h}"><div class="bar"><a class="back" role="button" tabindex="0" data-go="-1"><i></i>目錄</a><span class="run">${T}</span></div><div class="hero"><h2>${g.t}</h2><p>${g.n}　${g.s.length} 首</p></div><ul class="pieces">${rows}</ul></div>`;
}
function go(e){const a=e.target.closest("[data-go]");if(!a)return;e.preventDefault();const i=+a.dataset.go;if(i>=0)detail(i);else home();window.scrollTo(0,0)}
app.addEventListener("click",go);
app.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" ")go(e)});
home();
</script>
</body>
</html>
